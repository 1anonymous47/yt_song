<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Playlister - Searcher</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#23005c",
                        "primary-fixed-dim": "#d0bcff",
                        "on-secondary-container": "#004d44",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#ca801e",
                        "surface-container-low": "#1b1b1f",
                        "tertiary-fixed-dim": "#ffb869",
                        "surface-container-high": "#2a292e",
                        "surface-bright": "#39393d",
                        "secondary-container": "#03c6b2",
                        "primary-container": "#a078ff",
                        "on-surface": "#e4e1e7",
                        "outline": "#958ea0",
                        "on-tertiary-fixed": "#2c1700",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#673d00",
                        "surface-tint": "#d0bcff",
                        "tertiary": "#ffb869",
                        "outline-variant": "#494454",
                        "on-primary-fixed-variant": "#5516be",
                        "secondary-fixed": "#62fae3",
                        "surface": "#131317",
                        "surface-container": "#1f1f23",
                        "primary": "#d0bcff",
                        "primary-fixed": "#e9ddff",
                        "surface-container-highest": "#353439",
                        "on-tertiary": "#482900",
                        "on-primary": "#3c0091",
                        "on-surface-variant": "#cbc3d7",
                        "inverse-on-surface": "#303034",
                        "secondary": "#44e2cd",
                        "surface-container-lowest": "#0e0e12",
                        "on-secondary-fixed-variant": "#005047",
                        "tertiary-fixed": "#ffdcbb",
                        "error": "#ffb4ab",
                        "secondary-fixed-dim": "#3cddc7",
                        "on-secondary-fixed": "#00201c",
                        "background": "#131317",
                        "inverse-primary": "#6d3bd7",
                        "on-error": "#690005",
                        "on-background": "#e4e1e7",
                        "surface-variant": "#353439",
                        "on-primary-container": "#340080",
                        "inverse-surface": "#e4e1e7",
                        "on-tertiary-container": "#3f2300",
                        "surface-dim": "#131317"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-xs": "4px",
                        "stack-md": "16px",
                        "sidebar-width": "260px",
                        "margin-desktop": "32px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "player-height": "96px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"], "body-md": ["Inter"], "body-sm": ["Inter"],
                        "label-sm": ["Inter"], "display-lg": ["Inter"], "headline-lg": ["Inter"],
                        "headline-md": ["Inter"], "display-sm": ["Inter"], "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-sm": ["10px", {"lineHeight": "14px", "fontWeight": "500"}],
                        "display-lg": ["64px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-sm": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0F0F13; color: #e4e1e7; overflow-x: hidden; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-panel { background: rgba(26, 26, 34, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0F0F13; }
        ::-webkit-scrollbar-thumb { background: #494454; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #958ea0; }
        
        /* High-visibility accessible outline layer for assistive systems */
        *:focus-visible { outline: 2px solid #44e2cd; outline-offset: 2px; }
    </style>
</head>
<body class="font-body-md text-body-md min-h-screen flex flex-col relative">

    <!-- Global Floating Toast Notification Container Pop-up -->
    <div id="toast-container" class="fixed top-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none max-w-md w-full sm:w-auto" role="live" aria-live="polite"></div>

    <!-- Responsive Mobile Backdrop Overlay Layer -->
    <div id="sidebar-overlay" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden transition-opacity duration-300 opacity-0" aria-hidden="true"></div>

    <!-- SideNavBar (Slide Drawer on Mobile Viewports) -->
    <aside id="side-nav" class="fixed left-0 top-0 h-full w-[260px] bg-surface-container-low border-r border-outline-variant/10 flex flex-col py-stack-lg z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0" aria-label="Main App Navigation">
        <div class="px-6 mb-stack-lg flex justify-between items-center">
            <div>
                <h1 class="font-headline-md text-headline-md font-bold text-primary">Playlister</h1>
                <p class="font-label-md text-label-md text-on-surface-variant opacity-70">Premium Audio</p>
            </div>
            <!-- Mobile Navigation Exit Trigger Menu -->
            <button onclick="toggleMobileSidebar()" class="lg:hidden p-2 text-on-surface-variant hover:text-on-surface rounded-full focus-visible:ring-2 focus-visible:ring-secondary/50" aria-label="Close navigation panel menu">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
        </div>
        <nav class="flex-1 space-y-2">
            <a class="flex items-center gap-4 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors rounded-lg mx-2" href="#">
                <span class="material-symbols-outlined" aria-hidden="true">home</span>
                <span class="font-body-md">Home</span>
            </a>
            <a class="flex items-center gap-4 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors rounded-lg mx-2" href="/downloader">
                <span class="material-symbols-outlined" aria-hidden="true">download</span>
                <span class="font-body-md">Downloader</span>
            </a>
            <a class="flex items-center gap-4 px-4 py-3 text-secondary font-bold border-l-4 border-secondary bg-secondary/10 transition-colors mx-2" href="/searcher" aria-current="page">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;" aria-hidden="true">search</span>
                <span class="font-body-md">Searcher</span>
            </a>
            <a class="flex items-center gap-4 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors rounded-lg mx-2" href="/playlister">
                <span class="material-symbols-outlined" aria-hidden="true">playlist_add</span>
                <span class="font-body-md">Playlist</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content Shell -->
    <main class="w-full lg:pl-[260px] pb-player-height flex-1 transition-all duration-300">
        <!-- TopNavBar -->
        <header class="fixed top-0 right-0 left-0 lg:left-[260px] h-16 bg-surface/70 backdrop-blur-xl flex justify-between items-center px-4 lg:px-margin-desktop z-40 border-b border-outline-variant/10">
            <div class="flex items-center flex-1 max-w-xl gap-3">
                <!-- Mobile Navigation Expand Trigger Menu Open Button -->
                <button onclick="toggleMobileSidebar()" class="lg:hidden p-2 text-on-surface-variant hover:text-on-surface rounded-lg focus-visible:ring-2 focus-visible:ring-secondary/50" aria-label="Open sidebar menu list navigation options panel">
                    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
                </button>
            </div>
            <div class="flex items-center gap-4 lg:gap-6">
                <button class="text-on-surface-variant hover:text-primary transition-colors flex items-center p-1 rounded-full" aria-label="System Alerts Hub">
                    <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
                </button>
                <button class="text-on-surface-variant hover:text-primary transition-colors flex items-center p-1 rounded-full" aria-label="Environment Settings Panel">
                    <span class="material-symbols-outlined" aria-hidden="true">settings</span>
                </button>
                <div class="hidden sm:block h-6 w-[1px] bg-outline-variant/30 mx-1"></div>
                
                <button onclick="logout()" class="font-label-md text-label-md text-on-surface-variant hover:text-error transition-colors cursor-pointer outline-none px-2 py-1 rounded">
                    Logout
                </button>
            </div>
        </header>

        <!-- Content Canvas Fluid Wrapper Core Area Grid Layout -->
        <section class="pt-24 px-4 lg:px-margin-desktop">
            <div class="mb-stack-lg">
                <h2 class="text-3xl lg:text-display-sm font-bold text-on-surface mb-2">Cloud Engine Searcher</h2>
                <p class="font-body-md text-on-surface-variant opacity-80 text-sm lg:text-base">Query global streaming databases to instantly port high-fidelity video tracks into your personal collection.</p>
            </div>

            <!-- Search Bar Controller Input Module Context Block -->
            <div class="glass-panel p-4 lg:p-6 rounded-xl border border-outline-variant/10 mb-stack-lg shadow-xl">
                <div class="flex flex-col md:flex-row gap-4 items-center">
                    <div class="relative flex-1 w-full">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary" aria-hidden="true">search</span>
                        <input id="searchurl" class="w-full bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/50 border border-outline-variant/20 focus:border-secondary focus:ring-2 focus:ring-secondary/20 rounded-xl py-3 pl-12 pr-4 text-body-sm transition-all outline-none" placeholder="Enter keywords, video titles, or video identifiers..." type="text" aria-label="Streaming search indexing text database parameter queries input keywords fields text box container">
                    </div>
                    <button onclick="searcher()" class="w-full md:w-auto px-6 py-3.5 bg-secondary text-on-secondary-fixed font-bold rounded-xl hover:scale-105 active:scale-95 shadow-lg shadow-secondary/20 transition-all flex items-center justify-center gap-2 whitespace-nowrap focus-visible:ring-2 focus-visible:ring-secondary/50">
                        <span class="material-symbols-outlined" aria-hidden="true">travel_explore</span>
                        Query Engine
                    </button>
                </div>
                <div id="status" class="text-body-sm text-secondary font-medium mt-3 px-1" role="status" aria-live="polite"></div>
            </div>

            <!-- Target Results Dynamic Responsive Grid Wrapper Container Structure -->
            <div id="list" class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-stack-lg" aria-live="polite">
                <!-- Search results injected here dynamically -->
            </div>

            <!-- Premium Navigation Pagination UI Controls Footer Node Panel -->
            <nav id="pagination-controls" class="hidden justify-between items-center bg-surface-container-low/40 border border-outline-variant/10 rounded-xl p-4 gap-2 flex-wrap" aria-label="Dynamic Search Engine Page Results Content Pager Controllers Block UI">
                <button id="prev-btn" onclick="changePage(-1)" class="px-4 py-2.5 text-body-sm rounded-lg border border-outline-variant/20 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all flex items-center gap-1 disabled:opacity-30 disabled:pointer-events-none focus-visible:ring-2 focus-visible:ring-secondary/50">
                    <span class="material-symbols-outlined text-sm" aria-hidden="true">arrow_back_ios</span> Previous
                </button>
                <div id="page-numbers" class="flex items-center gap-2 flex-wrap">
                    <!-- Page items will be rendered here dynamically -->
                </div>
                <button id="next-btn" onclick="changePage(1)" class="px-4 py-2.5 text-body-sm rounded-lg border border-outline-variant/20 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all flex items-center gap-1 disabled:opacity-30 disabled:pointer-events-none focus-visible:ring-2 focus-visible:ring-secondary/50">
                    Next <span class="material-symbols-outlined text-sm" aria-hidden="true">arrow_forward_ios</span>
                </button>
            </nav>
        </section>
    </main>

    <script>
        let globalSearchData = [];
        let currentPage = 1;
        const itemsPerPage = 4;
        
        const sideNav = document.getElementById('side-nav');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        // Handles adaptive drawer toggle animations on small tracking media viewports
        function toggleMobileSidebar() {
            const isHidden = sideNav.classList.contains('-translate-x-full');
            if (isHidden) {
                sideNav.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
                setTimeout(() => sidebarOverlay.classList.add('opacity-100'), 10);
            } else {
                sideNav.classList.add('-translate-x-full');
                sidebarOverlay.classList.remove('opacity-100');
                setTimeout(() => sidebarOverlay.classList.add('hidden'), 300);
            }
        }

        function triggerToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            toast.className = `glass-panel pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-xl border shadow-2xl translate-y-2 opacity-0 transition-all duration-300 border-l-4`;
            
            if (type === 'success') {
                toast.classList.add('border-l-secondary', 'border-outline-variant/20');
                toast.innerHTML = `
                    <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1" aria-hidden="true">check_circle</span>
                    <p class="text-body-sm text-on-surface font-medium">${message}</p>
                `;
            } else if (type === 'info') {
                toast.classList.add('border-l-primary', 'border-outline-variant/20');
                toast.innerHTML = `
                    <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1" aria-hidden="true">info</span>
                    <p class="text-body-sm text-on-surface-variant font-medium">${message}</p>
                `;
            } else {
                toast.classList.add('border-l-error', 'border-error-container/30');
                toast.innerHTML = `
                    <span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1" aria-hidden="true">error</span>
                    <p class="text-body-sm text-on-surface font-medium">${message}</p>
                `;
            }

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        }

        function searcher() {
            const list = document.getElementById('list');
            const status = document.getElementById('status');
            const pagination = document.getElementById('pagination-controls');
            
            list.innerHTML = '';
            status.innerHTML = '';
            pagination.classList.add('hidden');
            
            triggerToast("Query sent. Processing index streams across active shards...", 'info');
            
            const searchurl = document.getElementById('searchurl').value;
            fetch('/api/searcher', {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ 'searchid': searchurl })
            })
            .then(res => res.json())
            .then(data => {
                if (data['data'] !== "fail" && data.data && data.data.length > 0) {
                    globalSearchData = data.data;
                    currentPage = 1;
                    adder();
                } else {
                    triggerToast("No items found. Verify source media identifier or check connection.", 'error');
                }
            })
            .catch(err => {
                console.error("Transmission error:", err);
                triggerToast("Server connection error during database evaluation.", 'error');
            });
        }

        function adder() {
            const list = document.getElementById('list');
            list.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, globalSearchData.length);
            const activePageData = globalSearchData.slice(startIndex, endIndex);

            activePageData.forEach((videoId, index) => {
                const absoluteIndex = startIndex + index + 1;
                const container = document.createElement('div');
                container.className = "glass-panel rounded-xl overflow-hidden border border-outline-variant/10 flex flex-col hover:border-secondary/30 transition-all group shadow-md";
                
                container.innerHTML = `
                    <div class="relative w-full aspect-video bg-surface-container-lowest">
                        <iframe class="w-full h-full border-none" src="https://www.youtube.com/embed/${videoId}" allowfullscreen title="Embedded video streaming preview frame player item node mapping structure element allocation for reference track id ${videoId}"></iframe>
                    </div>
                    <div class="p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mt-auto border-t border-outline-variant/5 bg-surface-container-low/30 w-full">
                        <div class="overflow-hidden w-full sm:w-auto">
                            <p class="font-body-md text-on-surface font-semibold truncate">Track Asset Block #${absoluteIndex}</p>
                            <p class="text-body-sm text-on-surface-variant truncate opacity-60">Source Ref: ${videoId}</p>
                        </div>
                        <button id="btn-${videoId}" onclick="downloader('${videoId}')" class="w-full sm:w-auto px-4 py-3 bg-primary/10 hover:bg-primary text-primary hover:text-on-primary font-bold text-body-sm rounded-lg transition-all flex items-center justify-center gap-2 shrink-0 disabled:opacity-40 disabled:bg-surface-container-highest disabled:text-on-surface-variant/40 disabled:pointer-events-none focus-visible:ring-2 focus-visible:ring-primary/50">
                            <span class="material-symbols-outlined text-body-md" aria-hidden="true">playlist_add</span>
                            ADD TO PLAYLIST
                        </button>
                    </div>
                `;
                list.appendChild(container);
            });

            renderPaginationControls();
        }

        function renderPaginationControls() {
            const pagination = document.getElementById('pagination-controls');
            const pageNumbersContainer = document.getElementById('page-numbers');
            const totalPages = Math.ceil(globalSearchData.length / itemsPerPage);

            if (totalPages <= 1) {
                pagination.classList.add('hidden');
                return;
            }

            pageNumbersContainer.innerHTML = '';
            document.getElementById('prev-btn').disabled = (currentPage === 1);
            document.getElementById('next-btn').disabled = (currentPage === totalPages);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                if (i === currentPage) {
                    pageBtn.className = "w-9 h-9 rounded-lg bg-secondary text-on-secondary font-bold text-body-sm shadow-md shadow-secondary/10 transition-all focus-visible:ring-2 focus-visible:ring-secondary/50";
                    pageBtn.setAttribute('aria-current', 'page');
                } else {
                    pageBtn.className = "w-9 h-9 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all text-body-sm focus-visible:ring-2 focus-visible:ring-secondary/50";
                }
                pageBtn.innerText = i;
                pageBtn.setAttribute('aria-label', `Navigate forward and focus content allocation inside tracking slice window index block dashboard page ${i}`);
                pageBtn.onclick = () => {
                    currentPage = i;
                    adder();
                };
                pageNumbersContainer.appendChild(pageBtn);
            }

            pagination.classList.remove('hidden');
            pagination.classList.add('flex');
        }

        function changePage(direction) {
            const totalPages = Math.ceil(globalSearchData.length / itemsPerPage);
            const targetPage = currentPage + direction;

            if (targetPage >= 1 && targetPage <= totalPages) {
                currentPage = targetPage;
                adder();
            }
        }

        function downloader(element) {
            const btn = document.getElementById(`btn-${element}`);
            const originalHTML = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined text-body-md animate-spin" aria-hidden="true">sync</span> INGESTING...`;
            
            const url = "https://www.youtube.com/watch?v=" + element;
            fetch('/api/downloader', {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ 'url': url }),
            })
            .then(res => res.json())
            .then(data => {
                if (data['data'] == "success") {
                    playlistadder(data['audioid'], btn, originalHTML);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;

                    if (data['data'] == "fail") {
                        triggerToast("Authentication failure: Invalid secure user context profile.", 'error');
                        document.getElementById('status').innerHTML = "Invalid username identity.";
                    } else {
                        triggerToast("Malformed structural pointer link asset reference.", 'error');
                        document.getElementById('status').innerHTML = "Malformed structural pointer reference.";
                    }
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
                triggerToast("Connection failed during file encoding setup step.", 'error');
            });
        }

        function playlistadder(audioid, originalButton, originalButtonHTML) {
            fetch('/api/playlistadder', {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ 'audioid': audioid }),
            })
            .then(res => res.json())
            .then(data => {
                if (data['data'] == "success") {
                    originalButton.disabled = true;
                    originalButton.className = "w-full sm:w-auto px-4 py-3 bg-secondary/10 text-secondary font-bold text-body-sm rounded-lg flex items-center justify-center gap-2 shrink-0 pointer-events-none";
                    originalButton.innerHTML = `<span class="material-symbols-outlined text-body-md" style="font-variation-settings: 'FILL' 1" aria-hidden="true">task_alt</span> ADDED`;
                    triggerToast("Media asset ingested and cataloged successfully!");
                } else {
                    originalButton.disabled = true;
                    originalButton.className = "w-full sm:w-auto px-4 py-3 bg-surface-container-highest text-on-surface-variant/40 font-bold text-body-sm rounded-lg flex items-center justify-center gap-2 shrink-0 pointer-events-none";
                    originalButton.innerHTML = `<span class="material-symbols-outlined text-body-md" aria-hidden="true">cloud_done</span> IN LIBRARY`;
                    triggerToast("Asset selection halted: Track already exists in destination catalog.", 'info');
                }
            })
            .catch(() => {
                originalButton.disabled = false;
                originalButton.innerHTML = originalButtonHTML;
                triggerToast("Network tracking error adding node element to storage registry.", 'error');
            });
        }

        function logout() {
            fetch("/api/logout", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({})
            })
            .then(res => res.json())
            .then(data => { window.location.href = data["data"]; })
            .catch(() => { window.location.href = "/login"; });
        }
    </script>
</body>
<script src="static/js/common.js"></script>
</html>
