<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Playlister - Premium Portal Access</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#23005c",
                        "primary-fixed-dim": "#d0bcff",
                        "on-secondary-container": "#004d44",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#ca801e",
                        "surface-container-low": "#1b1b1f",
                        "tertiary-fixed-dim": "#ffb869",
                        "surface-container-high": "#2a292e",
                        "surface-bright": "#39393d",
                        "secondary-container": "#03c6b2",
                        "primary-container": "#a078ff",
                        "on-surface": "#e4e1e7",
                        "outline": "#958ea0",
                        "on-tertiary-fixed": "#2c1700",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#673d00",
                        "surface-tint": "#d0bcff",
                        "tertiary": "#ffb869",
                        "outline-variant": "#494454",
                        "on-primary-fixed-variant": "#5516be",
                        "secondary-fixed": "#62fae3",
                        "surface": "#131317",
                        "surface-container": "#1f1f23",
                        "primary": "#d0bcff",
                        "primary-fixed": "#e9ddff",
                        "surface-container-highest": "#353439",
                        "on-tertiary": "#482900",
                        "on-primary": "#3c0091",
                        "on-surface-variant": "#cbc3d7",
                        "inverse-on-surface": "#303034",
                        "secondary": "#44e2cd",
                        "surface-container-lowest": "#0e0e12",
                        "on-secondary-fixed-variant": "#005047",
                        "tertiary-fixed": "#ffdcbb",
                        "error": "#ffb4ab",
                        "secondary-fixed-dim": "#3cddc7",
                        "on-secondary-fixed": "#00201c",
                        "background": "#131317",
                        "inverse-primary": "#6d3bd7",
                        "on-error": "#690005",
                        "on-background": "#e4e1e7",
                        "surface-variant": "#353439",
                        "on-primary-container": "#340080",
                        "inverse-surface": "#e4e1e7",
                        "on-tertiary-container": "#3f2300",
                        "surface-dim": "#131317"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-sm": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0F0F13; color: #e4e1e7; overflow: hidden; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-panel { background: rgba(26, 26, 34, 0.45); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.04); }
        .radial-glow { background: radial-gradient(circle at 50% 50%, rgba(208, 188, 255, 0.08) 0%, rgba(68, 226, 205, 0.02) 50%, transparent 100%); }
    </style>
</head>
<body class="font-body-md text-body-md min-h-screen relative flex items-center justify-center px-4">

    <!-- Ambient Grid glow element -->
    <div class="absolute inset-0 radial-glow pointer-events-none z-0"></div>

    <!-- Floating Toast Pop-up Notification Center -->
    <div id="toast-container" class="fixed top-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none max-w-md w-full sm:w-auto"></div>

    <!-- Login Box Shell Box Container -->
    <main class="w-full max-w-[440px] glass-panel rounded-2xl p-8 sm:p-10 shadow-2xl relative z-10 border border-outline-variant/10">
        <!-- Brand identity headers -->
        <div class="text-center mb-8">
            <h1 class="font-display-sm text-display-sm font-bold text-primary tracking-tight mb-1">Playlister</h1>
            <p class="text-body-sm text-on-surface-variant opacity-75">Connect to your high-fidelity music space</p>
        </div>

        <!-- Submission control structure wrapper -->
        <form onsubmit="event.preventDefault(); login();" class="space-y-6">
            <div>
                <label for="username" class="block font-label-md text-label-md text-on-surface-variant mb-2">ACCOUNT IDENTITY ID</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60">account_circle</span>
                    <input id="username" autocomplete="username" required class="w-full bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/30 border border-outline-variant/20 focus:border-secondary focus:ring-2 focus:ring-secondary/20 rounded-xl py-3 pl-12 pr-4 text-body-sm transition-all outline-none" placeholder="Enter your subscriber token profile name..." type="text">
                </div>
                <div id="error-message-inline" class="text-body-sm text-error font-medium mt-2 hidden flex items-center gap-1.5 animate-pulse">
                    <span class="material-symbols-outlined text-[16px]">error</span>
                    <span id="error-text"></span>
                </div>
            </div>

            <button id="login-btn" type="submit" class="w-full py-3.5 bg-secondary text-on-secondary-fixed font-bold rounded-xl hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-secondary/10 hover:shadow-secondary/20 transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-body-md">lock_open</span>
                Authenticate Access
            </button>
        </form>

        <!-- New User Redirection Button Context -->
        <div class="mt-6 pt-5 border-t border-outline-variant/5 text-center">
            <p class="text-body-sm text-on-surface-variant/60 mb-3">New to the database engine?</p>
            <a href="/register" class="inline-flex w-full items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-outline-variant/20 bg-surface-container-high/40 hover:bg-surface-container-high text-primary hover:text-primary-fixed-dim font-semibold text-body-sm transition-all group">
                <span class="material-symbols-outlined text-body-md group-hover:translate-x-0.5 transition-transform">person_add</span>
                Create New Profile Token
            </a>
        </div>

        <!-- Dynamic informational structural guidelines -->
        <footer class="mt-5 text-center">
            <p class="text-[10px] text-on-surface-variant opacity-40 tracking-wider">SECURE SHARD ENCRYPTED SESSION GATEWAY</p>
        </footer>
    </main>

    <script>
        // System Wide Dynamic Pop-up Toast Interface Generator
        function triggerToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            toast.className = `glass-panel pointer-events-auto flex items-center gap-3 px-5 py-4 rounded-xl border shadow-2xl translate-y-3 opacity-0 transition-all duration-300 border-l-4`;
            
            if (type === 'success') {
                toast.classList.add('border-l-secondary', 'border-outline-variant/20');
                toast.innerHTML = `
                    <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1">check_circle</span>
                    <p class="text-body-sm text-on-surface font-medium">${message}</p>
                `;
            } else {
                toast.classList.add('border-l-error', 'border-error-container/30');
                toast.innerHTML = `
                    <span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1">gpp_bad</span>
                    <p class="text-body-sm text-on-surface font-medium">${message}</p>
                `;
            }

            container.appendChild(toast);

            // Reflow engine timeline triggers for visualization
            setTimeout(() => {
                toast.classList.remove('translate-y-3', 'opacity-0');
            }, 10);

            // Self-terminating container loop
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function login() {
            const usernameInput = document.getElementById('username');
            const username = usernameInput.value.trim();
            const loginBtn = document.getElementById('login-btn');
            const inlineError = document.getElementById('error-message-inline');
            const inlineErrorText = document.getElementById('error-text');

            // Reset UI State parameters
            inlineError.classList.add('hidden');
            usernameInput.classList.remove('border-error', 'focus:border-error', 'focus:ring-error/20');

            if (!username) {
                inlineErrorText.textContent = "Identity target context is missing.";
                inlineError.classList.remove('hidden');
                return;
            }

            // Lock interactive node elements during query transaction
            loginBtn.disabled = true;
            const originalHTML = loginBtn.innerHTML;
            loginBtn.innerHTML = `<span class="material-symbols-outlined text-body-md animate-spin">sync</span> Validating Credentials...`;

            fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-type': 'application/json'
                },
                body: JSON.stringify({ 'username': username })
            })
            .then(n => {
                if (!n.ok) throw new Error("Server transmission pipeline broken");
                return n.json();
            })
            .then(res => {
                if (res['data'] === "fail") {
                    // Inject clear failure visual updates to form fields
                    usernameInput.classList.add('border-error', 'focus:border-error', 'focus:ring-error/20');
                    inlineErrorText.textContent = "Invalid account identity token context identifier.";
                    inlineError.classList.remove('hidden');
                    
                    // Fire clear popup alert component
                    triggerToast("Authentication failed: Access denied to user space profile context.", 'error');
                    
                    // Re-enable interactions
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = originalHTML;
                } else {
                    triggerToast("Identity confirmed. Access granted to premium session core...", 'success');
                    
                    // Fluid navigation redirection sequence context
                    setTimeout(() => {
                        window.location.href = res['redirect'];
                    }, 1000);
                }
            })
            .catch(err => {
                console.error("Authentication crash runtime error:", err);
                triggerToast("Connection fault encountered while probing local node database sharding layers.", 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = originalHTML;
            });
        }
    </script>
</body>
</html>
