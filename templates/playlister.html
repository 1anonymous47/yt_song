    <script>
        let songscount;
        let currentsong = 0;
        let key = [];
        let value = [];
        let audio = null;
        let isPlaying = false;

        // UI Element Selectors
        const songsTbody = document.getElementById('songs-tbody');
        const trackSlider = document.getElementById('track-slider');
        const volumeSlider = document.getElementById('volume-slider');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const playIcon = document.getElementById('play-icon');
        const trackImg = document.getElementById('current-track-img');
        const trackTitle = document.getElementById('current-track-title');
        const trackAlbum = document.getElementById('current-track-album');
        const sideNav = document.getElementById('side-nav');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        // Mobile responsive sidebar toggler
        function toggleMobileSidebar() {
            const isHidden = sideNav.classList.contains('-translate-x-full');
            if (isHidden) {
                sideNav.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
                setTimeout(() => sidebarOverlay.classList.add('opacity-100'), 10);
            } else {
                sideNav.classList.add('-translate-x-full');
                sidebarOverlay.classList.remove('opacity-100');
                setTimeout(() => sidebarOverlay.classList.add('hidden'), 300);
            }
        }

        // Format timestamps cleanly
        function formatTime(secs) {
            if (isNaN(secs)) return "0:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function playlistadder() {
            fetch('/api/playlistgetter')
            .then(res => res.json())
            .then(data => {
                if (data.data === "nouser") {
                    window.alert("Invalid Username");
                    return;
                }
                if (data.data === "noplay") {
                    window.alert("Empty Playlist");
                    return;
                }

                key = Object.keys(data);
                value = Object.values(data);
                songscount = key.length;

                renderPlaylistTable();
                
                if (songscount > 0) {
                    initAudioContext(currentsong);
                }
            })
            .catch(err => {
                console.error("Local data fallback injection active.", err);
            });
        }

        function renderPlaylistTable() {
            songsTbody.innerHTML = '';
            
            value.forEach((trackArray, index) => {
                const row = document.createElement('tr');
                row.className = "group hover:bg-surface-container-highest/40 transition-colors cursor-pointer focus-visible:bg-surface-container-highest/60 outline-none";
                row.id = `track-row-${index}`;
                row.tabIndex = 0; // Accessible keyboard focus
                row.setAttribute('role', 'button');
                row.setAttribute('aria-label', `Play ${trackArray[0]}`);
                
                row.onclick = () => player(index);
                row.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); player(index); } };

                row.innerHTML = `
                    <td class="px-6 py-4 text-on-surface-variant font-body-sm index-cell">${index + 1}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-4">
                            <img src="${trackArray[1]}" alt="" class="w-10 h-10 lg:w-12 lg:h-12 rounded-lg object-cover shadow-md error-fallback">
                            <div class="min-w-0">
                                <p class="font-body-md text-on-surface font-semibold title-text truncate">${trackArray[0]}</p>
                                <p class="text-body-sm text-on-surface-variant truncate">Artist Profile</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="removeSong(event, '${key[index]}', ${index})" class="p-2 text-on-surface-variant hover:text-error transition-colors rounded-full relative z-10" aria-label="Remove ${trackArray[0]} from playlist">
                            <span class="material-symbols-outlined text-[20px]">delete</span>
                        </button>
                    </td>
                `;
                songsTbody.appendChild(row);
            });
            
            if (audio) {
                updateUIElements(currentsong);
            }
        }

        function removeSong(event, songId, index) {
            event.stopPropagation(); // Prevents row click selection triggers
            
            fetch('/api/rmsong', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ "song_id": songId })
            })
            .then(res => res.json())
            .then(resData => {
                if (resData.data === "success") {
                    // Logic to adjust playback indices safely before altering data structures
                    let playingTargetEnded = false;
                    
                    if (index === currentsong) {
                        if (audio) audio.pause();
                        isPlaying = false;
                        playIcon.textContent = "play_arrow";
                        playingTargetEnded = true;
                    }

                    // Mutate state containers
                    key.splice(index, 1);
                    value.splice(index, 1);
                    songscount = key.length;

                    if (songscount === 0) {
                        currentsong = 0;
                        trackImg.src = "https://lh3.googleusercontent.com/aida-public/AB6AXuBs973Smk9vNCP8pFQqUTWPhMhNFyqZxjVwbaUFbrmozhLqdHHVKevPGN-PqiZQrHEb9pYA3ddRm4FSph0_fXeQnTjmQoLzE6mPub2vqDdfO7EEWg4J-Hpx2KBZPnqT32V3ARh55gwd_ZprQyJx9_xF5fRCSSHmSmTGLavkg4Jr7junYR3VjTIL7jlxw_BNWFvgBsNoQ_vzN3uOOxi36TBvMxXpRsI990oywMghTbf3m0Vaeh0YaqmjeVSfdwr2-UmfkUhS3HEsGWw";
                        trackTitle.textContent = "---";
                        trackAlbum.textContent = "---";
                        timeCurrent.textContent = "0:00";
                        timeTotal.textContent = "0:00";
                        trackSlider.value = 0;
                        audio = null;
                    } else {
                        if (index < currentsong) {
                            currentsong--;
                        } else if (currentsong >= songscount) {
                            currentsong = songscount - 1;
                        }
                        
                        if (playingTargetEnded) {
                            initAudioContext(currentsong);
                        }
                    }

                    renderPlaylistTable();
                } else {
                    window.alert("Failed to remove song.");
                }
            })
            .catch(err => {
                console.error("Failed handling removal API.", err);
            });
        }

        function initAudioContext(index) {
            if (audio) {
                audio.pause();
            }

            audio = new Audio('/static/audios/' + value[index][2]);
            audio.volume = volumeSlider.value;
            
            reuser(index);

            audio.onended = () => {
                changer(1);
            };
        }

        function reuser(index) {
            trackImg.src = value[index][1];
            trackTitle.textContent = value[index][0];
            trackAlbum.textContent = "Premium Release";

            updateUIElements(index);

            audio.addEventListener("loadedmetadata", () => {
                trackSlider.max = audio.duration;
                timeTotal.textContent = formatTime(audio.duration);
            });

            audio.ontimeupdate = () => {
                if (!trackSlider.matches(':focus')) {
                    trackSlider.value = audio.currentTime;
                }
                timeCurrent.textContent = formatTime(audio.currentTime);
            };
        }

        function updateUIElements(index) {
            for (let i = 0; i < songscount; i++) {
                const targetRow = document.getElementById(`track-row-${i}`);
                if (targetRow) {
                    const indexCell = targetRow.querySelector('.index-cell');
                    const titleText = targetRow.querySelector('.title-text');
                    
                    if (i === index) {
                        targetRow.classList.add('bg-primary/5');
                        targetRow.setAttribute('aria-selected', 'true');
                        indexCell.className = "px-6 py-4 text-secondary font-bold index-cell flex items-center gap-2";
                        indexCell.innerHTML = `<span class="material-symbols-outlined animate-pulse text-sm" aria-hidden="true">equalizer</span> ${i + 1}`;
                        titleText.className = "font-body-md text-secondary font-bold title-text truncate";
                    } else {
                        targetRow.classList.remove('bg-primary/5');
                        targetRow.removeAttribute('aria-selected');
                        indexCell.className = "px-6 py-4 text-on-surface-variant font-body-sm index-cell";
                        indexCell.innerHTML = `${i + 1}`;
                        titleText.className = "font-body-md text-on-surface font-semibold title-text truncate";
                    }
                }
            }
        }

        function togglePlayback() {
            if (!audio) return;
            if (isPlaying) {
                pause();
            } else {
                play();
            }
        }

        function play() {
            if (!audio) return;
            audio.play();
            isPlaying = true;
            playIcon.textContent = "pause";
            document.getElementById('master-play-btn').setAttribute('aria-label', 'Pause');
        }

        function pause() {
            if (!audio) return;
            audio.pause();
            isPlaying = false;
            playIcon.textContent = "play_arrow";
            document.getElementById('master-play-btn').setAttribute('aria-label', 'Play');
        }

        function player(index) {
            currentsong = index;
            initAudioContext(index);
            play();
        }

        function changer(direction) {
            if (direction === 0) {
                if (currentsong === 0) {
                    window.alert("First track of playlist");
                    return;
                }
                currentsong--;
            } else {
                if (currentsong === key.length - 1) {
                    window.alert("Last track of playlist");
                    return;
                }
                currentsong++;
            }

            initAudioContext(currentsong);
            play();
        }

        trackSlider.addEventListener("input", () => {
            if (audio) audio.currentTime = trackSlider.value;
        });

        volumeSlider.addEventListener("input", () => {
            if (audio) audio.volume = volumeSlider.value;
        });

        const favBtn = document.getElementById('fav-icon');
        if (favBtn) {
            favBtn.parentElement.addEventListener('click', (e) => {
                e.stopPropagation();
                const isFilled = favBtn.style.fontVariationSettings?.includes("'FILL' 1");
                favBtn.style.fontVariationSettings = isFilled ? "'FILL' 0" : "'FILL' 1";
                favBtn.classList.toggle('text-secondary');
            });
        }

        window.addEventListener('DOMContentLoaded', playlistadder);
    </script>
</body>
<script src="static/js/common.js"></script>
</html>
